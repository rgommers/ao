[workspace]
authors = ["Ralf Gommers <ralf.gommers@gmail.com>"]
channels = ["conda-forge"]
name = "torchao"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]

[dependencies]
ninja = ">=1.13.2,<2"
cmake = "<4"
cxx-compiler = ">=1.11.0,<2"
setuptools = ">=76.0.0,<82"
wheel = ">=0.47.0,<0.48"
ccache = ">=4.13.6,<5"
pip = ">=26.1.1,<27"
pytest = "==9.0.3"
numpy = ">=2.4.6,<3"


[feature.cuda]
platforms = ["linux-64"]
system-requirements = { cuda = "13" }

[feature.cuda.dependencies]
cuda-compiler = "*"
cuda-libraries-dev = "*"
cuda-version = "13.0.*"

[feature.cuda.pypi-dependencies]
# 2.12.0 was just released, seems to give a build error in a .cu file
torch = { version = ">=2.11.0, <2.12.0" }

[feature.cuda.tasks.build]
cmd ="python -m pip install -e . -v --no-build-isolation --no-deps"
description = "Build torchao in editable mode for CUDA"
env = { CC = "$CC", CXX = "$CXX", CMAKE_KEEP_TEMP_FILES="1", CUDA_PATH="$CONDA_PREFIX", CUDA_HOME="$CONDA_PREFIX", CMAKE_CUDA_COMPILER="$CONDA_PREFIX/bin/nvcc", TORCH_CUDA_ARCH_LIST="8.0", MAX_JOBS="12", NVCC_APPEND_FLAGS="-diag-suppress 2908 -Xcompiler -Wno-deprecated-declarations"}
#env = { CC = "ccache $CC", CXX = "ccache $CXX", nvcc="ccache nvcc", CMAKE_KEEP_TEMP_FILES="1", CUDA_PATH="$CONDA_PREFIX", CUDA_HOME="$CONDA_PREFIX", CMAKE_CUDA_COMPILER="$CONDA_PREFIX/bin/nvcc", TORCH_CUDA_ARCH_LIST="8.0", MAX_JOBS="12" }

[feature.cuda.activation]
scripts = ["./activate-cuda.sh"]


[feature.free-threading.dependencies]
python-freethreading = ">=3.14.0,<3.15.0"

[feature.free-threading.tasks.build-nogil]
cmd ="python -m pip install -e . -v --no-build-isolation --no-deps"
description = "Build torchao in editable mode for CUDA"
env = { CC = "$CC", CXX = "$CXX", CMAKE_KEEP_TEMP_FILES="1", CUDA_PATH="$CONDA_PREFIX", CUDA_HOME="$CONDA_PREFIX", CMAKE_CUDA_COMPILER="$CONDA_PREFIX/bin/nvcc", TORCH_CUDA_ARCH_LIST="8.0", MAX_JOBS="12", NVCC_APPEND_FLAGS="-diag-suppress 2908 -Xcompiler -Wno-deprecated-declarations"}


# CPU-only feature, used for free-threading CI on aarch64 (and as a
# CPU-only x86 development fallback). PyTorch CPU wheels are pulled from
# the PyTorch index URL since the default PyPI index does not carry CPU-only
# variants for cp314t.
[feature.cpu]
platforms = ["linux-64", "linux-aarch64"]

[feature.cpu.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]

[feature.cpu.pypi-dependencies]
torch = ">=2.11.0, <2.12.0"

[feature.cpu.tasks.build-cpu]
cmd = "python -m pip install -e . -v --no-build-isolation --no-deps"
description = "Build torchao in editable mode (CPU only). BUILD_TORCHAO_EXPERIMENTAL=1 triggers the CMake-based shared_kernels build (registers _linear_8bit_act_*bit_weight etc. — uses fallback kernels on x86, aarch64 kernels when TORCHAO_BUILD_CPU_AARCH64=1 is also set). USE_CPU_KERNELS=1 enables x86 AVX-512 / AVX-10.2 aten_kernels (no-op on aarch64). On aarch64 CI, set TORCHAO_BUILD_CPU_AARCH64=1 etc. via the workflow's env: block."
env = { CC = "$CC", CXX = "$CXX", CMAKE_KEEP_TEMP_FILES="1", BUILD_TORCHAO_EXPERIMENTAL="1", USE_CPU_KERNELS="1", MAX_JOBS="4" }


[environments]
default = ["cuda"]
nogil = ["cuda", "free-threading"]
# CI environment for free-threading on CPU (no CUDA). Used by
# .github/workflows/free_threading_aarch64_cpu.yml.
nogil-cpu = ["cpu", "free-threading"]

[pypi-dependencies]
parameterized = ">=0.9.0, <0.10"
packaging = "*"
transformers = ">=5.8.1, <6"
hypothesis = ">=6.152.9, <7"
sentencepiece = ">=0.2.1, <0.3"
expecttest = ">=0.3.0, <0.4"
pyyaml = ">=6.0.3, <7"
fire = ">=0.7.1, <0.8"
tabulate = ">=0.10.0, <0.11"
matplotlib = ">=3.10.9, <4"
pandas = ">=3.0.3, <4"
tiktoken = ">=0.13.0, <0.14"
tqdm = ">=4.66.5, <5"
#importlib-metadata = ">=9.0.0, <10"
